<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhiteTire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#111a33; --muted:#5b6682; --line:#e1e5ef; --accent:#2f54d6; --soft:#eef1fa;
  --display:"DM Sans",system-ui,sans-serif; --dur:1s; --ease:cubic-bezier(.22,.8,.24,1); --slide:cubic-bezier(.6,.05,.25,1); --step:.1s; --body:"DM Sans",system-ui,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0d1120; --card:#171d30; --ink:#eef1f8; --muted:#98a2bb; --line:#272f48; --accent:#8aa6ff; --soft:#1f2740;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;padding-bottom:150px;transition:background .25s,color .25s}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* animations (slow and smooth: change --dur / --step at the top to tune) */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.5) rotate(-14deg)}to{opacity:1;transform:none}}
@keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}30%{transform:rotate(-12deg) scale(1.15)}65%{transform:rotate(10deg) scale(1.15)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes nudge{0%,80%,100%{transform:rotate(0)}86%{transform:rotate(-12deg)}93%{transform:rotate(10deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px) rotate(-8deg)}40%{transform:translateX(4px) rotate(8deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.shake{animation:shake .8s ease-in-out}
body,.pc,.card,.mt,.infobtn,input,nav,.iconbtn,.av,.tag,.stat,.demo,code,.ic,.mi{transition:background-color .5s,color .5s,border-color .5s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.01em;text-decoration:none}
.logo{width:28px;height:28px;background:var(--ink);display:grid;place-items:center;color:var(--bg);font-size:16px;
  clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn:hover svg{animation:wiggle 1s ease-in-out}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.dc{fill:currentColor;stroke:none}
.iconbtn svg{width:20px;height:20px}
.toast{position:fixed;right:16px;bottom:calc(144px + env(safe-area-inset-bottom,0px));transform:translateY(10px);z-index:40;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:none}

h1,h2,.rkb,.tnum,.step .n,.av,.slogan,.stat b,.brand,.logo{font-weight:700}
h1,h2{letter-spacing:-.01em}
.rkb,.tnum,.pts{font-variant-numeric:tabular-nums}
/* hero */
.hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin:10px 0 18px}
h1{font-family:var(--display);font-size:clamp(28px,6vw,46px);line-height:1.1;margin:0}
.sub{color:var(--muted);margin:8px 0 0;max-width:52ch}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 18px;min-width:140px}
.stat span{display:block;font-size:13px;color:var(--muted)}
.stat b{font-family:var(--display);font-size:24px;display:block;line-height:1.2;overflow-wrap:anywhere}

/* gamemode tabs: one bar, a highlight slides to the picked tab */
.mtabs{position:relative;display:flex;gap:4px;overflow-x:auto;padding:6px;margin-bottom:16px;border:1px solid var(--line);border-radius:22px;background:var(--card);scrollbar-width:none;cursor:grab}
.mtabs::-webkit-scrollbar{display:none}
.mtabs:active{cursor:grabbing}
.slider{position:absolute;left:0;top:0;width:0;height:0;border-radius:16px;background:var(--ink);pointer-events:none;z-index:0;transition:left .8s var(--slide),top .8s var(--slide),width .8s var(--slide),height .8s var(--slide)}
.mt{position:relative;z-index:1;flex:none;min-width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;font-weight:500;font-size:13px;padding:10px 12px 8px;border-radius:16px;border:0;background:transparent;color:var(--muted);cursor:pointer;transition:color .6s}
.mt:hover{color:var(--ink)}
.mt[aria-pressed="true"]{color:var(--bg);font-weight:700}
.mt span:last-child{text-align:center;line-height:1.25}
@media (min-width:760px){.mtabs{flex-wrap:wrap;overflow:visible;cursor:default}.mt{flex:1 1 84px;padding:10px 6px 8px}}
.mi,.ic{display:grid;place-items:center;border-radius:50%;color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--card));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);flex:none}
.mi{width:34px;height:34px}.mi svg{width:19px;height:19px}
.mt:hover .mi svg{animation:wiggle 1s ease-in-out}
.mt[aria-pressed="true"] .mi svg{animation:wiggle 1.2s ease-in-out}
.enter .hero{animation:fadeUp var(--dur) var(--ease) both}
.enter .step,.enter .stat{animation:fadeUp var(--dur) var(--ease) both}

.infobtn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:14px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;margin-bottom:14px}
.infobtn svg{width:18px;height:18px}
.infobtn:hover svg{animation:wiggle 1s ease-in-out}
.infopanel{padding:16px 18px;margin-bottom:14px}
.pill:focus-visible,input:focus-visible,.tab:focus-visible,.fab:focus-visible,.btn:focus-visible,.iconbtn:focus-visible,.mt:focus-visible,.infobtn:focus-visible,.tb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:inherit;width:100%;padding:12px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px}
.bar{margin-bottom:14px}

/* player cards (MCTiers style) */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px}
.plist{display:grid;gap:12px}
.pc{display:flex;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.enter .pc{animation:fadeUp var(--dur) var(--ease) both;animation-delay:calc(var(--i,0)*var(--step))}
.rkb{flex:none;width:58px;display:grid;place-items:center;font-family:var(--display);font-size:24px;background:var(--soft);color:var(--muted)}
.rkb.r1{background:linear-gradient(160deg,#ffd75a,#e0a800);color:#4a3600}
.rkb.r2{background:linear-gradient(160deg,#dfe5ee,#9aa5b3);color:#2d3542}
.rkb.r3{background:linear-gradient(160deg,#e3a779,#b87a4b);color:#3d2210}
.pcb{flex:1;min-width:0;padding:14px 16px}
.pt{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-family:var(--display);font-size:20px;flex:none}
.pn{min-width:0}
.nm2{font-weight:700;font-size:17px;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ps{color:var(--muted);font-size:13px}
.tnum{margin-left:auto;text-align:right;font-family:var(--display);font-size:28px;line-height:1}
.tnum small{display:block;font-family:var(--body);font-size:12px;color:var(--muted)}
.tl{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin:14px 0 8px}
.tbs{display:flex;flex-wrap:wrap;gap:10px 12px}
.tb{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;cursor:pointer;font:inherit}
.enter .tb{animation:popIn .9s var(--ease) both;animation-delay:calc(var(--i,0)*var(--step) + var(--j,0)*.12s + .3s)}
.ic{width:40px;height:40px}.ic svg{width:21px;height:21px}
.tb:hover .ic svg,.tb:focus-visible .ic svg,.tb:active .ic svg{animation:wiggle 1s ease-in-out}
.tb:hover .ic{border-color:var(--c)}
.chip{display:inline-block;min-width:44px;text-align:center;padding:3px 8px;font-weight:700;font-size:13px;color:#16202b;
  clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px))}
.none{color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);letter-spacing:.5px}
.msg{padding:44px 16px;text-align:center;color:var(--muted)}
.foot{margin:14px 4px 0;font-size:13px;color:var(--muted)}
.demo{background:var(--soft);border:1px dashed var(--accent);border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:14px}

.single .pcb{display:flex;align-items:center;gap:12px}
.single .pt{flex:1}
.single .tbs{flex:none}
@media (min-width:760px){
  .rkb{width:64px}
  .pc:not(.single) .pcb{display:flex;align-items:center;gap:24px;padding:14px 20px}
  .pc:not(.single) .pt{flex:1;min-width:220px}
  .pc:not(.single) .tl{display:none}
  .pc:not(.single) .tbs{justify-content:flex-end;max-width:62%}
  .ic{width:36px;height:36px}.ic svg{width:19px;height:19px}
}
/* about */
h2{font-family:var(--display);font-size:26px;margin:34px 0 14px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.step{padding:18px}
.step .n{font-family:var(--display);font-size:30px;color:var(--accent);line-height:1}
.step p{margin:8px 0 0}
code{background:var(--soft);padding:2px 6px;border-radius:6px;font-size:.92em}
.legend{padding:6px 18px}
.lg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.lg:last-of-type{border-bottom:0}
.lgname{min-width:150px}
.lg .chip{margin:2px 4px 2px 0}
.facts{display:flex;flex-wrap:wrap;gap:12px}
.slogan{font-family:var(--display);font-size:22px;margin:26px 0 0}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;padding:11px 20px;border-radius:999px;background:#5865f2;color:#fff;text-decoration:none;margin-top:12px}
.btn svg{width:22px;height:22px}
.btn:hover svg{animation:wiggle 1s ease-in-out}
.cta{padding:22px;margin-top:26px}

/* floating discord button + bottom tabs */
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:8px;background:#5865f2;color:#fff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(30,40,120,.35)}
.fab svg{width:22px;height:22px;animation:nudge 7s ease-in-out infinite}
.fab:hover{filter:brightness(1.08)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navin{position:relative;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.ind{position:absolute;top:0;left:0;width:36px;height:3px;border-radius:0 0 4px 4px;background:var(--accent);transition:left .8s var(--slide)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;font-size:12px;font-weight:500;text-decoration:none;color:var(--muted)}
.tab:hover svg{animation:wiggle 1s ease-in-out}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] svg{stroke:var(--accent);stroke-width:2.4;animation:bounce .9s ease-in-out}

@media (max-width:640px){
  .fab{padding:12px 14px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="#bedrock"><span class="logo">W</span><span id="brand"></span></a>
    <button class="iconbtn" id="theme" aria-label="Switch light and dark mode"></button>
  </div>
  <main id="view"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<a class="fab" id="fab" target="_blank" rel="noopener">

</a>

<nav aria-label="Main">
  <div class="navin">
    <span class="ind" id="navind"></span>
    <a class="tab" href="#bedrock" data-v="bedrock"><svg viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg><span>Bedrock</span></a>

    <a class="tab" href="#testers" data-v="testers"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Tier Testers</span></a>

</nav>

<script>
/* ============ SETTINGS: edit this part ============ */
const SERVER_NAME = "WhiteTire";
const TAGLINE = "Every player's tier, updated live by our testers.";
const DISCORD_INVITE = "https://discord.gg/gtkPg8AFZe";
// Where the leaderboard data comes from: the bot's read-only link.
const DATA_URL = "https://whitetier.hidenplay.net/api/tiers";
const REFRESH_SECONDS = 60;
// Tier groups and points. ?? (not tested) = 0 points.
const GROUPS = ["GT","HT","LT","NT","BT"];
const GROUP_NAMES = {GT:"Grand Tier",HT:"High Tier",LT:"Low Tier",NT:"New Tier",BT:"Bad Tier"};
const OWNER = "WHITEGUY", MAX_PLAYERS = 100;
/* ================================================== */

const TIERS = [], POINTS = {};
const GROUP_POINTS = {
  GT:[155,150,145,140,135,130],
  HT:[125,120,115,110,105,100],
  LT:[95,90,85,80,75,70],
  NT:[65,60,55,50,45,40],
  BT:[35,30,25,20,15,10]
};
GROUPS.forEach(g=>{ for(let n=1;n<=6;n++){ const t=g+n; POINTS[t]=GROUP_POINTS[g][n-1]; TIERS.push(t); } });
const GROUP_COLORS = {GT:"#f2b705",HT:"#5ad0e6",LT:"#5fc27a",NT:"#b9a6e8",BT:"#e08a8a"};
const COLORS = {}; TIERS.forEach(t=>COLORS[t]=GROUP_COLORS[t.slice(0,2)]);

/* gamemode icons: the site picks one from the gamemode's name; unknown names get a shield */
const P = {
  trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-1.04 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98 1.04 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
  sword:'<path d="m11 19-6-6"/><path d="m5 21-2-2"/><path d="m8 16-4 4"/><path d="M9.5 17.5 21 6V3h-3L6.5 14.5"/>',
  heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  gem:'<path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/>',
  crystal:'<path d="M2.7 10.3a2.41 2.41 0 0 0 0 3.41l7.59 7.59a2.41 2.41 0 0 0 3.41 0l7.59-7.59a2.41 2.41 0 0 0 0-3.41l-7.59-7.59a2.41 2.41 0 0 0-3.41 0Z"/>',
  trident:'<path d="M12 22V7"/><path d="M6 3v5a6 6 0 0 0 12 0V3"/><path d="M12 3v4"/>',
  tmace:'<path d="M12 20V7"/><path d="M6 3v5a6 6 0 0 0 12 0V3"/><path d="M12 3v4"/><circle cx="12" cy="21" r="1.5"/>',
  mace:'<circle cx="15" cy="9" r="5"/><path d="m11.5 12.5-8 8"/><path d="M15 2v2M15 14v2M8 9h2M20 9h2"/>',
  flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  flask:'<path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>',
  axe:'<path d="m14 12-8.5 8.5a2.12 2.12 0 1 1-3-3L11 9"/><path d="M15 13 9 7l4-4 6 6h3a8 8 0 0 1-7 7z"/>',
  shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>'
};
const ICON_COLORS = {trophy:"#e0a800",sword:"#5b8def",heart:"#ef5b73",gem:"#22b8cf",crystal:"#a55eea",trident:"#1cc5a0",tmace:"#f0883e",mace:"#8d99ae",flame:"#f2603a",flask:"#e056a0",axe:"#c98a5a",shield:"#7a8cff"};
function modeIcon(name){
  const n=String(name).toLowerCase();
  const k = n==="overall"?"trophy" : n.includes("trident")&&n.includes("mace")?"tmace" : n.includes("trident")?"trident" : n.includes("mace")?"mace"
    : n.includes("sword")?"sword" : n.includes("uhc")?"heart" : n.includes("diamond")?"gem" : n.includes("cpvp")||n.includes("crystal")?"crystal"
    : n.includes("neth")?"flame" : n.includes("pot")?"flask" : n.includes("axe")?"axe" : "shield";
  return {p:P[k], c:ICON_COLORS[k]};
}
const svgIcon = p => `<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {bedrock:undefined, java:undefined, testers:undefined};   // undefined=loading, null=not set up, {error}=failed
const demo = {bedrock:false, testers:false};
const mode = {bedrock:"Overall", java:"Overall"};
let view = "bedrock", query = "", updated = "", testersHasCount = false, infoOpen = false;

document.title = SERVER_NAME;
$("brand").textContent = SERVER_NAME;
$("fab").href = DISCORD_INVITE;

/* ---------- toast ---------- */
let tt;
function showToast(text){
  const t=$("toast"); t.textContent=text; t.classList.add("show");
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2400);
}

/* ---------- dark mode (light by default, remembers your choice) ---------- */
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
function setTheme(t,save){
  document.documentElement.dataset.theme=t;
  $("theme").innerHTML = t==="dark"?SUN:MOON;
  if(save){ try{localStorage.setItem("theme",t)}catch(e){} }
}
let savedTheme="light"; try{ savedTheme=localStorage.getItem("theme")||"light" }catch(e){}
setTheme(savedTheme,false);
$("theme").onclick=()=>{
  const dark=document.documentElement.dataset.theme!=="dark";
  setTheme(dark?"dark":"light",true);
  showToast(dark?"Dark mode on":"Light mode on");
  const b=$("theme"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
};

/* ---------- turn the bot's data into what the page uses ---------- */
function buildPlayers(list,modes){
  const players=(list||[]).map(r=>{
    const p={name:String(r.player||"").trim(), status:String(r.status||"").trim().toUpperCase(), tiers:{}, points:0};
    modes.forEach(m=>{ const t=String((r.tiers||{})[m]||"").trim().toUpperCase(); if(POINTS[t]!==undefined){p.tiers[m]=t;p.points+=POINTS[t]} });
    return p;
  }).filter(p=>p.name);
  return {players,modes};
}
function buildTesters(list){
  testersHasCount=true;
  return (list||[]).map(t=>({name:String(t.name||"").trim(), role:String(t.role||"").trim(), modes:String(t.modes||"").trim(), tested:parseInt(t.tested,10)||0})).filter(t=>t.name);
}

/* ---------- small helpers ---------- */
const chip=t=>`<span class="chip" style="background:${COLORS[t]}">${t}</span>`;
const avatar=n=>`<span class="av">${esc(n.trim()[0]||"?").toUpperCase()}</span>`;
const tag=p=>p.status?`<span class="tag">${esc(p.status)}</span>`:"";
const demoBox=txt=>`<div class="demo">${txt}</div>`;
const INFO_ICON='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>';

function legendHTML(){
  return GROUPS.map(g=>`<div class="lg"><div class="lgname"><b>${g}</b> · ${GROUP_NAMES[g]}</div><div>${TIERS.filter(t=>t.startsWith(g)).map(t=>`<span class="chip" style="background:${COLORS[t]}">${t} · ${POINTS[t]}</span>`).join(" ")}</div></div>`).join("");
}
function ranked(d,m){
  const l = m==="Overall"
    ? d.players.filter(p=>Object.keys(p.tiers).length).map(p=>({p,score:p.points}))
    : d.players.filter(p=>p.tiers[m]).map(p=>({p,score:POINTS[p.tiers[m]]}));
  l.sort((a,b)=>b.score-a.score||a.p.name.localeCompare(b.p.name));
  l.forEach((x,i)=>x.rank=i+1);
  return l;
}

/* ---------- views ---------- */
function badge(n,t,j){
  const mi=modeIcon(n);
  return `<button type="button" class="tb" data-m="${esc(n)}" data-t="${t}" style="--c:${mi.c};--j:${j}" aria-label="${esc(n)} ${t}"><span class="ic">${svgIcon(mi.p)}</span>${chip(t)}</button>`;
}
function playerCard(x,i,m,d){
  const p=x.p, rk=`<div class="rkb ${x.rank<=3?"r"+x.rank:""}">${x.rank}</div>`;
  if(m!=="Overall")   // one gamemode picked: show only that gamemode's tier and points
    return `<article class="pc single" style="--i:${Math.min(i,12)}">${rk}<div class="pcb"><div class="pt">${avatar(p.name)}<div class="pn"><div class="nm2">${esc(p.name)} ${tag(p)}</div><div class="ps">${x.score} pts</div></div></div><div class="tbs">${badge(m,p.tiers[m],0)}</div></div></article>`;
  const mods=d.modes.filter(n=>p.tiers[n]);
  return `<article class="pc" style="--i:${Math.min(i,12)}">${rk}<div class="pcb"><div class="pt">${avatar(p.name)}<div class="pn"><div class="nm2">${esc(p.name)} ${tag(p)}</div><div class="ps">${x.score} pts · ${mods.length} ${mods.length===1?"gamemode":"gamemodes"}</div></div></div>`+
    `<div class="tl">TIERS</div><div class="tbs">${mods.map((n,j)=>badge(n,p.tiers[n],j)).join("")}</div></div></article>`;
}

function headText(key){
  const label=key==="bedrock"?"Bedrock":"Java", d=store[key], m=mode[key], count=ranked(d,m).length;
  return m==="Overall"
    ? [`Overall ${label} PvP Rankings`, `${count} players ranked by points across ${d.modes.length} gamemodes`]
    : [`${esc(m)} ${label} Rankings`, `${count} players ranked in ${esc(m)}`];
}
function placeSlider(animate){        // moves the highlight behind the picked gamemode tab
  const sl=$("slider"), a=document.querySelector('.mt[aria-pressed="true"]'); if(!sl||!a) return;
  if(!animate) sl.style.transition="none";
  sl.style.left=a.offsetLeft+"px"; sl.style.top=a.offsetTop+"px"; sl.style.width=a.offsetWidth+"px"; sl.style.height=a.offsetHeight+"px";
  if(!animate){ void sl.offsetWidth; sl.style.transition=""; }
}
let navReady=false;
function placeNavInd(animate){        // moves the blue bar over the picked bottom tab
  const ind=$("navind"), a=document.querySelector('.tab[aria-current="page"]'); if(!ind||!a) return;
  if(!animate) ind.style.transition="none";
  ind.style.left=(a.offsetLeft+(a.offsetWidth-36)/2)+"px";
  if(!animate){ void ind.offsetWidth; ind.style.transition=""; }
}
let dragMoved=false, dragBar=null, dragX=0, dragL=0;
window.addEventListener("pointermove",e=>{ if(!dragBar) return; const dx=e.clientX-dragX; if(Math.abs(dx)>5){ dragMoved=true; dragBar.scrollLeft=dragL-dx; } });
window.addEventListener("pointerup",()=>{ dragBar=null; });
window.addEventListener("resize",()=>{ placeSlider(false); placeNavInd(false); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ placeSlider(false); placeNavInd(false); });
function selectMode(key,m){          // changes only the list and heading, the rest of the page stays still
  mode[key]=m;
  document.querySelectorAll(".mt").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.m===m)));
  const [t,sTxt]=headText(key); $("htitle").innerHTML=t; $("hsub").innerHTML=sTxt;
  const v=$("view"); v.classList.remove("enter"); fillBoard(key); void v.offsetWidth; v.classList.add("enter");
  placeSlider(true);
  const act=document.querySelector('.mt[aria-pressed="true"]'); if(act) act.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
}
function boardView(key){
  const label = key==="bedrock"?"Bedrock":"Java";
  const d = store[key];
  const head = `<div class="hero"><div><h1>${label} Rankings</h1><p class="sub">${esc(TAGLINE)}</p></div></div>`;
  if(d===undefined) return head+`<div class="card"><div class="msg">Loading leaderboard…</div></div>`;
  if(d===null) return head+`<div class="card"><div class="msg"><b>${label} tier list is coming soon.</b><br>Check back later or join our Discord to get tested.</div></div>`;
  if(d.error) return head+`<div class="card"><div class="msg">Couldn't load the leaderboard right now. Please check your internet connection or try again in a moment.</div></div>`;
  const m = d.modes.includes(mode[key])||mode[key]==="Overall" ? mode[key] : "Overall"; mode[key]=m;
  const [title,subtxt] = headText(key);
  const tabs = ["Overall",...d.modes].map((n,i)=>{ const mi=modeIcon(n);
    return `<button class="mt" aria-pressed="${n===m}" data-m="${esc(n)}" style="--c:${mi.c}"><span class="mi">${svgIcon(mi.p)}</span><span>${esc(n)}</span></button>`; }).join("");
  return `<div class="mtabs" id="mtabs"><span class="slider" id="slider"></span>${tabs}</div>`+
    `<div class="hero"><div><h1 id="htitle">${title}</h1><p class="sub" id="hsub">${subtxt}</p></div></div>`+
    (demo[key]?demoBox("Showing demo data."):"")+
    `<button class="infobtn" id="infobtn" aria-expanded="${infoOpen}">${INFO_ICON}Information</button>`+
    `<div class="card infopanel" id="infopanel" ${infoOpen?"":"hidden"}><p style="margin:0 0 6px">Each tier has its listed point value (GT1 = 155 down to BT6 = 10). ?? means not tested and is worth 0 points. A player's overall score is the sum of their points in every gamemode. Tap an icon on a player to see the gamemode and tier.</p><div class="legend" style="padding:0">${legendHTML()}</div></div>`+
    `<div class="bar"><input id="q" type="search" placeholder="Search player" aria-label="Search player" value="${esc(query)}"></div>`+
    `<div id="list" class="plist"></div>`+
    `<p class="foot" id="foot">${updated?"Checked "+updated+" · refreshes automatically":""}</p>`;
}
function fillBoard(key){
  const d=store[key], m=mode[key];
  const list=ranked(d,m).filter(x=>!query||x.p.name.toLowerCase().includes(query.toLowerCase()));
  $("list").innerHTML = list.length ? list.map((x,i)=>playerCard(x,i,m,d)).join("") : `<div class="card"><div class="msg">No players found. Try a different search or gamemode.</div></div>`;
}

function testersView(){
  const d=store.testers;
  const head=`<div class="hero"><div><h1>Tier Testers</h1><p class="sub">Ranked by total players tested. Message one in our Discord to get tested.</p></div></div>`;
  if(d===undefined) return head+`<div class="card"><div class="msg">Loading testers…</div></div>`;
  if(d===null||d.error) return head+`<div class="card"><div class="msg">${d&&d.error?"Couldn't load the tester list.":"The tester list is coming soon."}</div></div>`;
  const list=testersHasCount?[...d].sort((a,b)=>b.tested-a.tested||a.name.localeCompare(b.name)):[...d];
  let rk=0, prev=null; list.forEach((t,i)=>{ if(t.tested!==prev){rk=i+1;prev=t.tested} t.rank=rk; });
  const sub=t=>[t.role,t.modes].filter(Boolean).map(esc).join(" · ");
  return head+(demo.testers?demoBox("Showing demo data."):"")+
    `<div class="plist">`+list.map((t,i)=>`<article class="pc" style="--i:${Math.min(i,12)}">${testersHasCount?`<div class="rkb ${t.rank<=3?"r"+t.rank:""}">${t.rank}</div>`:""}`+
      `<div class="pcb"><div class="pt">${avatar(t.name)}<div class="pn"><div class="nm2">${esc(t.name)}</div><div class="ps">${sub(t)}</div></div>${testersHasCount?`<div class="tnum">${t.tested}<small>tested</small></div>`:""}</div></div></article>`).join("")+`</div>`;
}

function aboutView(){
  return `<div class="hero"><div><h1>About ${esc(SERVER_NAME)}</h1><p class="sub">A Minecraft PvP tier-testing system where players prove their skills and earn a place in the ranking.</p></div></div>
  <div class="facts">
    <div class="stat"><span>Owner</span><b>${esc(OWNER)}</b></div>
    <div class="stat"><span>Platforms</span><b>Bedrock · Java</b></div>
    <div class="stat"><span>Max players</span><b>${MAX_PLAYERS}</b></div>
  </div>

  <h2>How to get tested</h2>
  <div class="steps">
    <div class="card step"><div class="n">1</div><p>Join our WhiteTier Discord server. In the <b>Tier Test</b> category, open the <b>#tier-test-req</b> channel and create a ticket.</p></div>
    <div class="card step"><div class="n">2</div><p>A Tier Tester contacts you and brings you into the server for your Tier Test, where your PvP skills are judged.</p></div>
    <div class="card step"><div class="n">3</div><p>You may be placed <b>UP</b> or <b>LOW</b> in your tier, depending on your performance and how the testers judge your skill.</p></div>
    <div class="card step"><div class="n">4</div><p>The tester posts your result in <b>#tier-result</b>, like <code>GT6 • GT1 • LT6 • NT2</code>. Your tier shows your current PvP performance.</p></div>
  </div>

  <h2>Tier system</h2>
  <div class="card legend">${legendHTML()}<p class="none">?? = not tested = 0 points</p></div>

  <h2>Rankings</h2>
  <div class="card step"><p style="margin:0">The owner posts the Top 1–5 players in the chat and they can promote something about them here. The ranking includes each player's name, current tier, points, and performance against Tier Testers.</p></div>

  <div class="card cta">
    <div class="slogan" style="margin:0">Prove your skill. Earn your tier. Climb the rankings.</div>
    <a class="btn" href="${esc(DISCORD_INVITE)}" target="_blank" rel="noopener"><svg class="dc" viewBox="0 0 24 24">${$("fab").querySelector("path").outerHTML}</svg>Join our Discord and get tested</a>
  </div>`;
}

/* ---------- render + routing ---------- */
function render(enter){
  const wasTyping = document.activeElement && document.activeElement.id==="q";
  document.querySelectorAll(".tab").forEach(a=>{ if(a.dataset.v===view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const isBoard = view==="bedrock"||view==="java";
  placeNavInd(navReady); navReady=true;
  $("view").className = enter?"enter":"";
  $("view").innerHTML = isBoard?boardView(view):view==="testers"?testersView():aboutView();
  if(isBoard && store[view] && !store[view].error){
    fillBoard(view);
    document.querySelectorAll(".mt").forEach(b=>b.onclick=()=>selectMode(view,b.dataset.m));
    const bar=$("mtabs");              // mouse users can scroll the tab bar with the wheel or by dragging it
    bar.addEventListener("wheel",e=>{ if(bar.scrollWidth>bar.clientWidth && Math.abs(e.deltaY)>Math.abs(e.deltaX)){ bar.scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});
    bar.addEventListener("pointerdown",e=>{ if(e.pointerType==="mouse"){ dragBar=bar; dragX=e.clientX; dragL=bar.scrollLeft; dragMoved=false; } });
    bar.addEventListener("click",e=>{ if(dragMoved){ e.stopPropagation(); e.preventDefault(); dragMoved=false; } },true);
    placeSlider(false);
    $("infobtn").onclick=()=>{ infoOpen=!infoOpen; $("infopanel").hidden=!infoOpen; $("infobtn").setAttribute("aria-expanded",infoOpen); };
    const q=$("q"); q.oninput=()=>{ query=q.value.trim(); $("view").className=""; fillBoard(view); };
    $("list").onclick=e=>{ const b=e.target.closest(".tb"); if(b) showToast(`${b.dataset.m} · ${b.dataset.t} · ${POINTS[b.dataset.t]} pts`); };
    if(wasTyping){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
  }
}
function route(){
  const h=(location.hash||"#bedrock").slice(1);
  view=["bedrock","java","testers","about"].includes(h)?h:"bedrock";
  query=""; render(true); window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* ---------- data (from the bot's link; the last good copy is kept in this browser) ---------- */
const CACHE_KEY="whitetier-data";
let usingSaved=false;
async function loadData(){
  try{
    const res=await fetch(DATA_URL,{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const j=await res.json();
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(j))}catch(e){}
    usingSaved=false;
    return j;
  }catch(e){
    // server unreachable (maintenance etc.): show the last copy this browser saved, if there is one
    try{ const s=localStorage.getItem(CACHE_KEY); if(s){ usingSaved=true; return JSON.parse(s); } }catch(e2){}
    return null;
  }
}
let lastSig="", loadedOnce=false;
async function refresh(){
  const j=await loadData();
  if(j){
    const modes=Array.isArray(j.gamemodes)?j.gamemodes:[];
    const b=buildPlayers(j.bedrock,modes), jv=buildPlayers(j.java,modes), t=buildTesters(j.testers);
    store.bedrock=b.players.length?b:null;                              // empty list = coming soon
    store.java=jv.players.length?jv:null;
    store.testers=t.length?t:null;
  }else{
    ["bedrock","java","testers"].forEach(k=>{ if(store[k]===undefined) store[k]={error:true}; });   // keep what is already shown
  }
  updated=new Date().toLocaleTimeString()+(usingSaved?" (saved copy, server unreachable)":"");
  const sig=JSON.stringify([store.bedrock,store.java,store.testers]);
  if(sig!==lastSig){ lastSig=sig; render(!loadedOnce); }               // only redraw when the data actually changed
  else if($("foot")) $("foot").textContent="Checked "+updated+" · refreshes automatically";
  loadedOnce=true;
}
route();
refresh();
setInterval(refresh,REFRESH_SECONDS*1000);
</script>
</body>
</html>
